# ============================================================================
# PHP QA CI - GitHub Actions Workflow Template
# ============================================================================
#
# INSTALLATION INSTRUCTIONS:
# --------------------------
# 1. Copy this file to your project's .github/workflows/qa.yml
# 2. Put your default branch under `push: branches:` below if it is not listed
# 3. Commit and push to your repository
#
# ONE RUN PER PUSH:
# -----------------
# - A pull request runs the pipeline on every push to its branch: `pull_request`.
# - A push runs it only on the branches listed under `push:`, which should be
#   your default branch. A branch that has a pull request open (a work branch,
#   or a long-lived `develop` that is merged into the default branch) is not
#   listed: its pull request already runs the pipeline, and a `push` run beside
#   it would run everything a second time.
# - A newer push to a pull request cancels the run it supersedes. A run on a
#   listed branch is never cancelled: the release workflow waits for it.
# - `php8.5` is php-qa-ci's own default branch, where this file runs unchanged.
#   A branch name that matches no branch of yours does nothing.
#
# GITHUB CONFIGURATION:
# ---------------------
# - The token is read-only (`permissions: contents: read`), so nothing needs
#   changing under Settings -> Actions -> General -> "Workflow permissions".
#   (The release workflow, release.yml, does need "Read and write permissions"
#   and "Allow GitHub Actions to create and approve pull requests".)
#
# Branch Protection (optional but recommended):
# - Go to Settings -> Branches, add a rule for your default branch
# - Check "Require status checks to pass before merging"
# - Select the check "QA Pipeline". It is the name of the `qa` job and does not
#   change with the PHP version. (scripts/setup-branch-protection.bash sets it.)
#   "PHP QA Pipeline" is the workflow name and is not a selectable status check.
#
# CUSTOMIZATION:
# --------------
# Project-specific QA configuration:
# - qaConfig/qa.php               - Override QA pipeline settings
# - qaConfig/phpstan.neon         - PHPStan configuration
# - qaConfig/phpunit.xml          - PHPUnit configuration
# - qaConfig/php_cs.php           - PHP CS Fixer rules
# - qaConfig/rector.php           - Rector rules
# - qaConfig/infection.json       - Infection configuration
#
# To skip specific tools in CI, add to env section:
#   useInfection: 0              - Skip mutation testing
#   phpUnitCoverage: 0            - Skip coverage generation
#   phpqaQuickTests: 1            - Run in quick test mode
#
# FIXES:
# ------
# The run is read-only: the fixers dry-run and fail on a pending change. To have
# them applied and committed back to the pull request, use the qa-autofix.yml
# template, whose gate validates the fixed tip in the same run.
#
# COVERAGE REPORT (optional):
# ---------------------------
# Set the repository variable PHP_QA_CI_COVERAGE_REPORT to "true" (Settings ->
# Secrets and variables -> Actions -> Variables) and a pull request from this
# repository gets a coverage summary comment. It never fails the pull request.
#
# WORKFLOW DISPATCH:
# ------------------
# You can manually trigger this workflow from GitHub UI:
# 1. Go to Actions tab
# 2. Select "PHP QA Pipeline"
# 3. Click "Run workflow"
# 4. Optionally select a specific tool to run
#
# ARTIFACTS:
# ----------
# The workflow saves test results and coverage reports as artifacts.
# You can download them from the workflow run page for 7 days.
#
# ============================================================================

name: PHP QA Pipeline

on:
  # Only the branches a pull request merges into: see "ONE RUN PER PUSH" above
  push:
    branches:
      - main
      - master
      - php8.5

  # Every pull request, whichever branch it targets
  pull_request:
    types: [opened, synchronize, reopened]

  # Allow manual triggering with optional tool selection
  workflow_dispatch:
    inputs:
      qa_tools:
        description: 'QA tool to run (all runs the full pipeline)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'        # Run full pipeline
          - 'phpstan'    # Static analysis only
          - 'phpunit'    # Unit tests only
          - 'rector'     # Code refactoring only
          - 'fixer'      # Code style fixing only
          - 'infection'  # Mutation testing only

concurrency:
  group: qa-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # REQUIRED: Tell QA tools we're in CI mode
  CI: true

  # OPTIONAL: Customize QA behavior
  # phpUnitCoverage: 1           # Enable coverage (default: 1 if xdebug available)
  # phpqaQuickTests: 1           # Quick test mode (default: 0)
  # useInfection: 0              # Disable infection (default: 1 if xdebug available)

jobs:
  qa:
    # A constant: this is the status check branch protection requires.
    name: QA Pipeline
    runs-on: ubuntu-latest
    # A lane that hangs would otherwise hold the required check open for hours.
    timeout-minutes: 45

    steps:
      # Full history and tags: the opt-in changelog lane judges everything
      # since the merge base or the last release tag, and fails on a shallow
      # clone. Nothing here pushes, so the token is not kept in the checkout.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The newest version listed that appears in composer.json's php
      # constraint; add a newer version to the front of the list when you move
      # to it. Falls back to 8.5 for a project that states no php constraint.
      - name: Detect PHP version from composer.json
        id: php
        run: |
          CONSTRAINT=$(jq -r '.require.php // "^8.5"' composer.json)
          PHP_VERSION=8.5
          for V in 8.5 8.4 8.3 8.2 8.1 8.0; do
            if [[ "$CONSTRAINT" == *"$V"* ]]; then PHP_VERSION="$V"; break; fi
          done
          echo "Found PHP constraint $CONSTRAINT, using PHP $PHP_VERSION"
          echo "version=$PHP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          tools: composer:v2
          coverage: xdebug
          # Add all common PHP extensions needed by most projects
          # Add more if your project needs them
          extensions: mbstring, intl, json, zip, dom, curl, libxml, xmlwriter, xmlreader, xml, simplexml, iconv, pdo, pdo_sqlite, calendar
          ini-values: |
            memory_limit=4G
            xdebug.mode=coverage

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      # The qa entry point lives in composer's bin-dir: vendor/bin unless
      # composer.json sets config.bin-dir. The QA tools themselves ship inside
      # the package (vendor-phar/), so nothing else needs installing.
      - name: Verify php-qa-ci installation
        id: locate
        run: |
          QA="$(composer config bin-dir)/qa"
          if [ ! -f "$QA" ]; then
            echo "Error: $QA not found. Add 'lts/php-qa-ci' to your composer.json"
            exit 1
          fi
          echo "qa=$QA" >> "$GITHUB_OUTPUT"

      - name: Cache QA tools
        uses: actions/cache@v6
        with:
          path: var/qa/cache
          key: ${{ runner.os }}-qa-cache-${{ steps.php.outputs.version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-qa-cache-${{ steps.php.outputs.version }}-

      # Read-only: the fixers dry-run and fail on a pending change.
      - name: Run QA Pipeline
        env:
          QA: ${{ steps.locate.outputs.qa }}
          QA_READONLY: '1'
          QA_TOOL: ${{ inputs.qa_tools || 'all' }}
        run: |
          if [ "$QA_TOOL" = "all" ]; then
            echo "Running full QA pipeline"
            "$QA"
          else
            echo "Running specific tool: $QA_TOOL"
            "$QA" -t "$QA_TOOL"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            var/qa/phpunit_logs/
            var/qa/infection/
          retention-days: 7

      - name: Upload coverage reports
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            var/qa/phpunit_coverage/
            var/qa/phpunit_logs/coverage.clover
          retention-days: 7

  # Opt-in: see "COVERAGE REPORT" above. The only job that writes, and only a
  # comment on the pull request. A pull request from a fork has a read-only
  # token that cannot comment, so it is skipped.
  coverage-report:
    name: Coverage Report
    needs: qa
    if: >-
      github.event_name == 'pull_request'
      && vars.PHP_QA_CI_COVERAGE_REPORT == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Code Coverage Summary
        if: hashFiles('coverage/phpunit_logs/coverage.clover') != ''
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/phpunit_logs/coverage.clover
          badge: true
          format: markdown
          output: both

      - name: Add Coverage PR Comment
        if: hashFiles('code-coverage-results.md') != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: code-coverage-results.md
