name: CI

on:
  push:
    branches: [php8.5]
  pull_request:
    branches: [php8.5]

jobs:
  # This job exists to publish the `ShellCheck (severity=warning)` status
  # context that the branch rule requires. It runs the SHIPPED LANE — the same
  # pinned binary at vendor-bin/shellcheck, the same git-tracked discovery — so
  # there is still exactly one ShellCheck mechanism, invoked twice. Never
  # reintroduce a separately-installed shellcheck here: a second pin is what
  # Plan 00008 removed, and it drifted from the lane by three versions.
  shellcheck:
    name: ShellCheck (severity=warning)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: json, tokenizer, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run the shellCheck lane
        run: bin/qa -t shellCheck

  qa:
    name: QA Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          extensions: json, tokenizer, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run QA Pipeline
        run: bash ci.bash
