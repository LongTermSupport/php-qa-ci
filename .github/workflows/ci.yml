name: CI

on:
  push:
    branches: [php8.4]
  pull_request:
    branches: [php8.4]

jobs:
  shellcheck:
    name: ShellCheck (severity=error)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck at error severity
        # Fail the build on any error-severity finding in the pipeline's own
        # Bash sources. Covers the entry point, CI wrapper, tool fragments under
        # includes/, and the install/support scripts. Warning-level findings are
        # intentionally NOT gated here (a later cleanup wave owns those).
        run: |
          shellcheck --version
          mapfile -t shellFiles < <(find includes scripts -type f \( -name '*.bash' -o -name '*.sh' \) | sort)
          shellcheck -S error bin/qa ci.bash "${shellFiles[@]}"

  qa:
    name: QA Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: xdebug
          extensions: json, tokenizer, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run QA Pipeline
        run: bash ci.bash
