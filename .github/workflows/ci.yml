name: CI

on:
  push:
    branches: [php8.5]
  pull_request:
    branches: [php8.5]

jobs:
  # ShellCheck has no job of its own: the `shellCheck` lane runs it inside
  # bin/qa, from the pinned binary at vendor-bin/shellcheck, over every
  # git-tracked shell file rather than a hand-maintained list. A second
  # mechanism here could only drift from that one.
  qa:
    name: QA Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          extensions: json, tokenizer, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run QA Pipeline
        run: bash ci.bash
