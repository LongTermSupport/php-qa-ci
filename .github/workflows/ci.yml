name: CI

on:
  push:
    branches: [php8.5]
  pull_request:
    branches: [php8.5]

jobs:
  shellcheck:
    name: ShellCheck (severity=warning)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck at warning severity
        # Fail the build on any warning-or-above finding in the pipeline's own
        # Bash sources. Covers the entry point, CI wrapper, tool fragments under
        # includes/, and the install/support scripts. These pass at -S warning:
        # every SC2154/SC2034/SC1090 false positive from the sourced-fragment
        # architecture carries a targeted `# shellcheck disable=SCxxxx` directive
        # with justification. Do not lower this to -S error.
        run: |
          shellcheck --version
          mapfile -t shellFiles < <(find includes scripts qaConfig -type f \( -name '*.bash' -o -name '*.sh' \) | sort)
          shellcheck -S warning \
            bin/qa \
            bin/composer-require-checker bin/infection bin/php-cs-fixer bin/phpstan \
            bin/lib-redirect-stub.inc.bash \
            ci.bash \
            git-hooks/pre-commit-check-vendor-uncommitted \
            "${shellFiles[@]}"

  qa:
    name: QA Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: xdebug
          extensions: json, tokenizer, mbstring

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run QA Pipeline
        run: bash ci.bash
