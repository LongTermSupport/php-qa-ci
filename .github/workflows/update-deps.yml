name: Update Dependencies

on:
  schedule:
    # Daily at 03:17 UTC: tracking the latest tools that pass QA is a standing
    # process (CLAUDE/tool-currency.md), not a weekly chore.
    - cron: '17 3 * * *'
  workflow_dispatch:

# The token reads and nothing more. `composer update` runs every plugin and script
# the new versions bring, and the QA run executes the project: neither may hold a
# token that can push, open a pull request or change an issue. The jobs below that
# write do no more than apply the verified result, open its pull request, approve
# its held run and report a failure, and each is granted only that.
permissions:
  contents: read

jobs:
  update-and-verify:
    name: Update Dependencies & Verify QA
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      # No explicit `ref:` — actions/checkout defaults to the repository's own
      # default branch for schedule/workflow_dispatch events. This keeps the
      # workflow correct when a consumer copies it verbatim: it operates on the
      # consumer's default branch, not php-qa-ci's. Full history and tags: the
      # changelog lane in the QA run below judges everything since the last
      # release tag, and fails on a shallow clone.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2, phive
          coverage: xdebug
          extensions: json, tokenizer, mbstring

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-update-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-update-
            ${{ runner.os }}-composer-

      # Step 1: Update composer dependencies (post-update-cmd runs the PHAR update
      # too, so the token is needed here as well)
      - name: Update composer dependencies
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: composer update --no-interaction --no-progress --prefer-dist

      # Step 2: Update PHARs. tool-install.bash update is the one place that
      # knows the trusted keys and the unsigned entries; it re-resolves every
      # phive.xml constraint non-interactively. (composer update above already
      # ran it as post-update-cmd; this step makes a failure visible.)
      - name: Update PHARs via phive
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: bash scripts/tool-install.bash update

      # Step 3: Update the self-built PHARs (rector, phpcpd, composer-dependency-analyser)
      # Bump each build/<tool>/ manifest (updates its composer.lock), then rebuild
      # vendor-phar/<tool>.phar. build-phar.bash auto-downloads a pinned Box and
      # sets phar.readonly=0 itself.
      - name: Update self-built PHARs
        run: |
          for manifest in build/*/composer.json; do
            composer update --working-dir="$(dirname "$manifest")" --no-interaction --no-dev
          done
          bash scripts/build-phar.bash --all --force

      # The PHAR update moved composer.json's replace of phpstan/phpstan to the
      # new phar's version (bin/phpstan-replace-sync), and the composer update
      # above resolved the PHPStan extensions against the old one. Resolve again
      # so they move up to what the new phar can load; a no-op otherwise.
      - name: Re-resolve the PHPStan extensions against the phar
        env:
          GITHUB_AUTH_TOKEN: ${{ github.token }}
        run: composer update --no-interaction --no-progress --prefer-dist

      # The active-defences region of CLAUDE.md counts the rules each installed
      # PHPStan extension registers, and a test holds it current, so an extension
      # release that changes its rule set would fail the QA run below. Regenerate
      # it from what the update installed; the change lands in the pull request.
      - name: Regenerate the active-defences region of CLAUDE.md
        run: php bin/rules . --write-agent-summary=CLAUDE.md

      # Step 4: Check for changes
      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat
          fi

      # Step 5: Record the update in CHANGELOG.md. A re-fetched or rebuilt tool is
      # a change every consumer receives, so the changelog lane in the QA run
      # requires an entry for it, and the release it leads to is decided by that
      # entry. The entry names each tool whose pinned version moved, and each
      # package that moved inside a self-built PHAR; an update
      # that moved none (composer.lock alone) ships nothing and records nothing.
      - name: Record the bundled tool updates in the changelog
        if: steps.changes.outputs.changed == 'true'
        run: php bin/changelog-release add-tool-updates

      # Step 6: Run full QA pipeline (only if changes detected). Writable, unlike
      # every other CI run: an updated Rector or PHP CS Fixer brings new rules,
      # and this job exists to take them, so they are applied and land in the
      # pull request for review instead of failing it. CI on php8.5 re-checks the
      # merged result read-only.
      #
      # It runs on a work branch with the update still uncommitted, so the
      # changelog lane measures the update from the merge base, exactly as it
      # will on the pull request; on the default branch it would measure from
      # the last release tag, where earlier Unreleased entries cover anything.
      # The job then returns to its checkout, carrying the working-tree changes
      # with it, so the patch packaged below is the change as the pull request
      # will have it. The work branch is not chore/update-deps, which the pull
      # request action creates and resets itself.
      - name: Run QA Pipeline
        if: steps.changes.outputs.changed == 'true'
        env:
          CI: true
          QA_READONLY: 0
          phpUnitQuickTests: 0
          phpUnitCoverage: 0
        run: |
          git switch --create chore/update-deps-qa
          bash ci.bash
          git switch -

      # Step 7: Package the verified result for the job that opens the pull
      # request: the working tree's change as a patch (new and binary files
      # included), and the pull request's description. Summaries only: the PR's
      # own diff tab carries the detail.
      - name: Package the update and its summary
        if: steps.changes.outputs.changed == 'true'
        run: |
          OUT="${RUNNER_TEMP}/update"
          BODY="${OUT}/body.md"
          mkdir -p "${OUT}"
          git add --all
          git diff --cached --binary --full-index > "${OUT}/update.patch"
          git reset --quiet

          {
            echo "Automated daily dependency update."
            echo ""
            echo "## Composer Changes"
            echo ""
            echo '```'
            git diff --stat composer.json composer.lock
            echo '```'
            echo ""
            echo "Package versions after the update:"
            echo ""
            echo '```'
            composer show --direct --no-interaction
            echo '```'
            echo ""
          } > "${BODY}"

          # Check for PHAR changes
          if ! git diff --quiet phive.xml vendor-phar/; then
            {
              echo "## PHAR Changes"
              echo ""
              for phar in vendor-phar/*.phar; do
                name=$(basename "$phar" .phar)
                # Only the first line of --version output is the version banner.
                version=$(php "$phar" --version 2>/dev/null | awk 'NR==1' || true)
                echo "- **$name**: ${version:-version unknown}"
              done
              echo ""
            } >> "${BODY}"
          fi

          # Check for self-built PHAR changes (keyed off each build manifest lock —
          # under reproducible builds the phar binary follows the lock).
          if ! git diff --quiet build/*/composer.lock; then
            {
              echo "## Self-built PHAR Changes"
              echo ""
              for manifest in build/*/composer.json; do
                name=$(basename "$(dirname "$manifest")")
                version=$(php "vendor-phar/$name.phar" --version 2>/dev/null | awk 'NR==1' || true)
                echo "- **$name**: ${version:-version unknown}"
              done
              echo ""
            } >> "${BODY}"
          fi

          {
            echo "---"
            echo "QA pipeline passed with these changes."
            echo ""
            echo "This PR was created automatically by the [update-deps](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/update-deps.yml) workflow."
          } >> "${BODY}"

      - name: Upload the update
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update
          path: ${{ runner.temp }}/update
          if-no-files-found: error
          retention-days: 1

  # The job that holds the write grants. It runs nothing from the repository and
  # installs nothing: it applies the patch the verified run produced to a fresh
  # checkout and opens the pull request, so the dependencies the update just
  # installed never execute beside a token that can push.
  open-pull-request:
    name: Open the dependency update pull request
    needs: update-and-verify
    if: needs.update-and-verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      operation: ${{ steps.create-pr.outputs.pull-request-operation }}
      head-sha: ${{ steps.create-pr.outputs.pull-request-head-sha }}

    steps:
      # No explicit `ref:`, as in the job above: the repository's default branch.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download the update
        uses: actions/download-artifact@v8
        with:
          name: dependency-update
          path: ${{ runner.temp }}/update

      - name: Apply the update
        run: git apply "${RUNNER_TEMP}/update/update.patch"

      # Only reached if QA passed: the job above fails first otherwise.
      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-deps
          delete-branch: true
          title: 'chore(deps): update dependencies'
          body-path: ${{ runner.temp }}/update/body.md
          labels: dependencies,automated
          commit-message: 'chore(deps): update all dependencies'

  # The pull request's CI run is held because GITHUB_TOKEN pushed it, and the
  # default branch requires its "QA Pipeline" check. Its own job, on a checkout
  # that never saw the update, because the action it runs is repository code
  # and this job may approve workflow runs.
  approve-ci:
    name: Approve the held CI run
    needs: open-pull-request
    if: needs.open-pull-request.outputs.operation == 'created' || needs.open-pull-request.outputs.operation == 'updated'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Approve CI on the pull request
        uses: ./.github/actions/approve-held-ci
        with:
          head-sha: ${{ needs.open-pull-request.outputs.head-sha }}
          token: ${{ github.token }}
          workflow: qa.yml

  # A failed run must reach someone: the one open issue labelled
  # update-deps-failure gets a comment linking the run, or, when none is
  # open, a new one is opened. CLAUDE/tool-currency.md says who acts on it.
  report-failure:
    name: Report the failure on the tracking issue
    needs: [update-and-verify, open-pull-request, approve-ci]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Report the failure on the tracking issue
        uses: actions/github-script@v9
        with:
          script: |
            const label = 'update-deps-failure';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The dependency update failed: ${run}\n\nRead the failing step, fix the cause on a branch (Defence Before Fix), and close this issue when an update lands green.`;
            const open = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open', per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title: 'The dependency update is failing', labels: [label, 'dependencies'], body });
            }
