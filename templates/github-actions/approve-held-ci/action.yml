name: Approve the held CI run
description: >-
  GitHub holds the pull_request CI run of a pull request opened or pushed with
  GITHUB_TOKEN (conclusion action_required) until someone with write access
  approves it, and a required check is satisfied only by that run: a run of the
  same commit from another event does not count. This waits for the named
  workflow's run on the pull request's head commit and approves it when it is
  held; one that was not held is left to run. The calling job needs
  `actions: write`. Shipped by php-qa-ci as
  templates/github-actions/approve-held-ci/action.yml; install it unchanged as
  .github/actions/approve-held-ci/action.yml.

inputs:
  head-sha:
    description: The pull request's head commit, e.g. create-pull-request's pull-request-head-sha output.
    required: true
  token:
    description: A token with actions write access.
    required: true
  workflow:
    description: >-
      The CI workflow whose held run to approve: its file name, or its path
      (e.g. github.event.workflow_run.path in a workflow_run job).
    required: true

runs:
  using: composite
  steps:
    - name: Approve the held CI run
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        WORKFLOW: ${{ inputs.workflow }}
      run: |
        set -euo pipefail
        workflow_file="${WORKFLOW%%@*}"
        workflow_file="${workflow_file##*/}"
        for attempt in $(seq 1 30); do
          runs="$(gh run list --workflow "${workflow_file}" --event pull_request --commit "${HEAD_SHA}" --json databaseId,conclusion --jq '.[] | "\(.databaseId) \(.conclusion)"')"
          if [ -n "${runs}" ]; then
            while read -r id conclusion; do
              if [ "${conclusion}" = "action_required" ]; then
                gh api --method POST "repos/${GH_REPO}/actions/runs/${id}/approve"
                echo "::notice::Approved ${workflow_file} run ${id} for ${HEAD_SHA}."
              fi
            done <<< "${runs}"
            exit 0
          fi
          echo "Waiting for the ${workflow_file} run on ${HEAD_SHA} (attempt ${attempt})."
          sleep 10
        done
        echo "::error::No ${workflow_file} run appeared for ${HEAD_SHA}; approve it from the pull request's Checks tab."
        exit 1
