name: Release

# ============================================================================
# php-qa-ci - changelog-driven releases (GitHub Actions workflow template)
# ============================================================================
#
# Releases the repository's default branch from CHANGELOG.md with a release
# pull request, the pattern release-please and changesets use, except that the
# changelog is written by hand (and enforced by php-qa-ci's changelog lane)
# rather than derived from commit messages:
#
#  1. CI goes green on a push to the default branch whose "## Unreleased" has
#     entries: open, or refresh, the release pull request from
#     chore/release-<default branch>. It moves the entries into
#     "## <version> — <date>"; nothing is released yet.
#  2. Merging that pull request is the decision to release. CI goes green on
#     the merge and this workflow publishes a GitHub Release, whose tag is cut
#     at the commit that wrote the section. Packagist reads the tag.
#
# The version is decided by the project's release policy in qaConfig/qa.php
# (semantic versioning unless it declares otherwise); every decision is a
# `changelog-release` subcommand and this file is plumbing. It needs no secret
# and bypasses no branch protection: GITHUB_TOKEN opens the pull request and
# creates the release.
#
# INSTALL, unchanged:
#   templates/github-actions/release.yml               -> .github/workflows/release.yml
#   templates/github-actions/approve-held-ci/action.yml -> .github/actions/approve-held-ci/action.yml
#
# `workflows:` below names the workflows whose green push run releases: CI,
# and the names php-qa-ci's QA templates carry (PHP QA Pipeline, QA). If the
# project's QA workflow has another name, or more than one of these runs on a
# push to the default branch, list only the one that gates a release.
#
# Repository settings it relies on: docs/github-actions.md, "Release
# automation".

on:
  workflow_run:
    workflows: [CI, PHP QA Pipeline, QA]
    types: [completed]

permissions: {}

concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Only a green push to the default branch releases; a workflow_run event
    # is delivered for every branch, so the branch is checked here.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      RELEASE_BRANCH: chore/release-${{ github.event.workflow_run.head_branch }}

    steps:
      - name: Checkout the default branch with history and tags
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      # Only the commit CI verified is acted on. When the branch has moved on,
      # the run for the newer push does the work (the concurrency group queues it).
      - name: Act only on the verified commit
        id: head
        env:
          VERIFIED: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$(git rev-parse HEAD)" = "${VERIFIED}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${BRANCH} has moved past ${VERIFIED}; the run for the newer push releases it."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect PHP version from composer.json
        id: php
        if: steps.head.outputs.current == 'true'
        run: |
          CONSTRAINT=$(jq -r '.require.php // "^8.5"' composer.json)
          PHP_VERSION=8.5
          for V in 8.5 8.4 8.3 8.2 8.1 8.0; do
            if [[ "$CONSTRAINT" == *"$V"* ]]; then PHP_VERSION="$V"; break; fi
          done
          echo "version=$PHP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.head.outputs.current == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.php.outputs.version }}
          tools: composer:v2
          coverage: none

      # The release CLI needs the autoloader only; --no-scripts keeps the
      # install from writing anything into the working tree.
      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      # A merged release pull request leaves a version section with no tag.
      # `gh release create --target` cuts the tag and publishes the release in
      # one call, so a re-run never finds a tag without its release.
      - name: Publish every merged release
        if: steps.head.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="$(composer config bin-dir)/changelog-release"
          "${RELEASE}" pending-tags > "${RUNNER_TEMP}/pending-tags.txt"
          while read -r tag commit; do
            "${RELEASE}" notes "${tag}" > "${RUNNER_TEMP}/notes.md"
            gh release create "${tag}" --target "${commit}" --title "${tag}" \
              --notes-file "${RUNNER_TEMP}/notes.md"
            echo "::notice::Released ${tag} at ${commit}."
          done < "${RUNNER_TEMP}/pending-tags.txt"
          git fetch --tags --quiet origin

      - name: Work out the next release
        id: next
        if: steps.head.outputs.current == 'true'
        run: echo "version=$("$(composer config bin-dir)/changelog-release" next-version)" >> "$GITHUB_OUTPUT"

      - name: Write the release into the changelog
        if: steps.next.outputs.version != ''
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          RELEASE="$(composer config bin-dir)/changelog-release"
          "${RELEASE}" apply "${VERSION}" "$(date -u +%Y-%m-%d)"
          {
            echo "Merging this pull request releases **${VERSION}**: CI on the merge publishes the GitHub Release and its tag. Until then, every green push to \`${BRANCH}\` refreshes it."
            echo
            "${RELEASE}" notes "${VERSION}"
          } > "${RUNNER_TEMP}/release-pr.md"

      - name: Open or refresh the release pull request
        id: release-pr
        if: steps.next.outputs.version != ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          base: ${{ env.BRANCH }}
          add-paths: CHANGELOG.md
          commit-message: Release ${{ steps.next.outputs.version }}
          title: Release ${{ steps.next.outputs.version }}
          body-path: ${{ runner.temp }}/release-pr.md
          delete-branch: true

      # The pull request's CI run is held because GITHUB_TOKEN pushed it, and a
      # required check is satisfied only by that run. The workflow to approve
      # is the one whose green run started this release.
      - name: Approve CI on the release pull request
        if: steps.release-pr.outputs.pull-request-operation == 'created' || steps.release-pr.outputs.pull-request-operation == 'updated'
        uses: ./.github/actions/approve-held-ci
        with:
          head-sha: ${{ steps.release-pr.outputs.pull-request-head-sha }}
          token: ${{ github.token }}
          workflow: ${{ github.event.workflow_run.path }}

      # "## Unreleased" emptied by hand leaves nothing for an open release pull
      # request to release.
      - name: Close a release pull request with nothing left to release
        if: steps.head.outputs.current == 'true' && steps.next.outputs.version == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open="$(gh pr list --head "${RELEASE_BRANCH}" --state open --json number --jq '.[].number')"
          for number in ${open}; do
            gh pr close "${number}" --delete-branch --comment '"## Unreleased" has no entries any more, so there is nothing to release.'
          done
