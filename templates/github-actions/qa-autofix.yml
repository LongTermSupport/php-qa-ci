        # FAIL-FAST GUARD for the #1 cryptic CI failure. composer.lock can pin a
        # private first-party dep to a github_deploy_* SSH alias; if the
        # CI_SSH_DEPLOY_BUNDLE secret does not carry that key (stale bundle after
        # a new dep was added, or unset entirely), `composer install` dies deep in
        # a `git clone` with:
        #     ssh: Could not resolve hostname github_deploy_<x>: ... name resolution
        # — which says nothing about the real cause. This step compares the aliases
        # composer.lock REQUIRES against the keys the bundle actually installed and,
        # if any are missing, names them up front with the one-command fix.
        #
        # It is inline (not the vendored ci-push-ssh-deploy-bundle.bash helper)
        # BECAUSE it must run BEFORE `composer install` — at which point vendor/ (and
        # thus that script) does not exist yet. It needs only composer.lock, jq, and
        # the ~/.ssh keys the previous step unpacked. The discovery jq mirrors
        # scripts/ci-push-ssh-deploy-bundle.bash (same source of truth: the
        # github_deploy_* aliases in composer.lock).
        run: |
          set -euo pipefail
          # Fail loudly on a malformed lock: otherwise an unparseable composer.lock
          # yields an empty alias list and this step falsely reports "all public",
          # masking the real breakage until composer errors one step later.
          jq empty composer.lock
          # Aliases this lock REQUIRES an SSH deploy key for (process substitution,
          # so a no-match `grep` exit does not trip errexit).
