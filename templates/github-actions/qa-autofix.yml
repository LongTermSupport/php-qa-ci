        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader --no-scripts

      # Read-only gate (GITHUB_ACTIONS=true → fixers run --dry-run and FAIL on any
      # pending change). Defaults to coding-standards + static analysis: a PHPUnit
