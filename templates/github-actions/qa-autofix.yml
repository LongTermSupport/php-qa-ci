          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::CI_SSH_DEPLOY_BUNDLE is missing deploy key(s) for: ${missing[*]}"
            {
              echo ""
              echo "composer.lock requires ${#required[@]} private-dep SSH alias(es):"
              echo "    required : ${required[*]}"
              echo "    present  : ${present[*]:-(none)}"
              echo "    MISSING  : ${missing[*]}"
              echo ""
              echo "Without these keys 'composer install' will fail cloning the missing repos"
              echo "with 'ssh: Could not resolve hostname github_deploy_<name>'."
              echo ""
              echo "FIX (once): from a dev container that holds the read-only deploy keys, run"
              echo "    vendor/lts/php-qa-ci/scripts/ci-push-ssh-deploy-bundle.bash"
              echo "It re-discovers ALL aliases from composer.lock, bundles their keys, and (re)sets"
              echo "the CI_SSH_DEPLOY_BUNDLE repository secret. If the secret was unset, it creates it."
            } >&2
            exit 1
          fi
          echo "OK: CI_SSH_DEPLOY_BUNDLE provides all ${#required[@]} required deploy key(s): ${required[*]}"

