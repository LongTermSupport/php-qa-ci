      # deferred. When your suite runs WITHOUT external services, add a tests step
      # (`vendor/bin/qa -t allTests`, or the full `vendor/bin/qa`) plus a `services:`
      # block to this job.
      - name: Coding standards — read-only check (Rector + PHP CS Fixer)
        env:
          CI: 'true'
        run: vendor/bin/qa -t allCS

      - name: Static analysis (PHPStan + PHPArkitect)
        env:
          CI: 'true'
        run: vendor/bin/qa -t allStatic
